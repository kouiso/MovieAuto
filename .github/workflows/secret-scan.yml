name: Secret Scan

# コード差分から鍵のようなものを探す（issue/PR/コメント本文は別検査）。
# ツールは gitleaks の固定版バイナリを使う。
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          VER=8.28.0
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            /tmp/gitleaks git --log-opts="$RANGE" --redact -v .
          else
            /tmp/gitleaks git --redact -v .
          fi
